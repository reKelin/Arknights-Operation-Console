name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Test CI contracts
        run: npm run test:ci

      - name: Cache Rust dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            windows-cargo-${{ runner.arch }}-

      - name: Regenerate stage catalog
        run: npm run stages:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check generated stage catalog
        run: git diff --exit-code -- src-tauri/data/stages.json src-tauri/data/operators.json

      - name: Regenerate bindings
        run: npm run bindings

      - name: Check generated bindings
        run: git diff --exit-code -- src/generated

      - name: Check frontend formatting and lint
        run: npm run check

      - name: Check TypeScript
        run: npx tsc -b

      - name: Test timeline logic
        run: npm test

      - name: Build frontend for Tauri context
        run: npm run build

      - name: Check Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
