name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Regenerate stage catalog
        run: npm run stages:sync

      - name: Check generated stage catalog
        run: git diff --exit-code -- src-tauri/data/stages.json

      - name: Regenerate bindings
        run: npm run bindings

      - name: Check generated bindings
        run: git diff --exit-code -- src/generated

      - name: Check frontend formatting and lint
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Check Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build Windows application
        run: npm run tauri build -- --no-bundle

      - name: Smoke test Windows application startup
        shell: pwsh
        run: |
          $path = "src-tauri/target/release/arknights-operation-runner.exe"
          $process = Start-Process $path -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Application exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: arknights-operation-runner-windows
          path: src-tauri/target/release/arknights-operation-runner.exe
          if-no-files-found: error
