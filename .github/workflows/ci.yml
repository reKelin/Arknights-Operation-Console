name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Regenerate stage catalog
        run: npm run stages:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check generated stage catalog
        run: git diff --exit-code -- src-tauri/data/stages.json src-tauri/data/operators.json

      - name: Regenerate bindings
        run: npm run bindings

      - name: Check generated bindings
        run: git diff --exit-code -- src/generated

      - name: Check frontend formatting and lint
        run: npm run check

      - name: Check TypeScript
        run: npx tsc -b

      - name: Test timeline logic
        run: npm test

      - name: Check Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
