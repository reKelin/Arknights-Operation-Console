name: Smoke

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    # 仅防止进程卡死；5 分钟是耗时观察参考值，不是硬性通过条件。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/run-timed.mjs dependencies -- npm ci
      - name: Test CI helpers and contracts
        run: node scripts/ci/run-timed.mjs ci-helpers -- npm run test:ci
      - name: Check formatting and lint
        run: node scripts/ci/run-timed.mjs biome -- npm run check
      - name: Check TypeScript and smoke fixtures
        run: |
          node scripts/ci/run-timed.mjs typescript -- npx tsc -b
          node scripts/ci/run-timed.mjs smoke-types -- npm run check:smoke
      - name: Check generated AxisLink types
        run: |
          node scripts/ci/run-timed.mjs axislink-bindings -- npm run bindings:axis
          git diff --exit-code -- src/generated/axislink.ts
      - name: Test frontend logic
        run: node scripts/ci/run-timed.mjs unit -- npm test
      - name: Install smoke browser
        run: node scripts/ci/run-timed.mjs browser-install -- npx playwright install --with-deps --only-shell chromium
      - name: Test basic UI functionality
        run: node scripts/ci/run-timed.mjs ui-smoke -- npm run test:smoke
      - name: Report duration trend
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CHECKS_OUTCOME: ${{ job.status }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { reportTiming } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/ci/timing.mjs')).href);
            await reportTiming({ github, context, core, jobName: 'Smoke', workflowFile: 'ci.yml', referenceSeconds: 300, outcome: process.env.CHECKS_OUTCOME });
      - name: Upload smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/smoke-results
            .local/smoke-report
            .local/ci-timings.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
