name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-test:
    # 私有仓库不分配 release runner；重新开源后也只由 tag / 显式手动操作触发。
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/smoke-tests.yml

  validate-build:
    name: Release validation
    needs: smoke-test
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    # 防卡死保护，不把原 30 分钟参考值当作硬性发布门槛。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check release version
        run: node scripts/ci/check-release-version.mjs
      - name: Install dependencies
        run: node scripts/ci/run-timed.mjs dependencies -- npm ci
      - name: Install pinned Rust toolchain
        run: node scripts/ci/run-timed.mjs rust-toolchain -- rustup show
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-windows-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            release-windows-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
      - name: Remove cached installers
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath src-tauri/target/release/bundle) {
            Remove-Item -LiteralPath src-tauri/target/release/bundle -Recurse -Force -ErrorAction Stop
          }
      - name: Build Windows app and installers
        run: node scripts/ci/run-timed.mjs windows-build -- npm run tauri -- build --ci
      - name: Check native process and window startup
        run: node scripts/ci/run-timed.mjs desktop-startup -- pwsh -NoProfile -File scripts/ci/smoke-desktop.ps1
      - name: Stage verified artifacts
        run: pwsh -NoProfile -File scripts/ci/stage-release.ps1
      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: .local/release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Report duration trend
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CHECKS_OUTCOME: ${{ job.status }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { reportTiming } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/ci/timing.mjs')).href);
            await reportTiming({ github, context, core, jobName: 'Release validation', workflowFile: 'release.yml', referenceSeconds: 1800, outcome: process.env.CHECKS_OUTCOME });
      - name: Upload release diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ci-timings.jsonl
            .local/desktop-smoke/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish verified release
    needs: [smoke-test, validate-build]
    if: ${{ !github.event.repository.private && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: release-artifacts
      - name: Verify artifact checksums
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - name: Publish the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes --draft "${prerelease[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
