name: Smoke Test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: smoke-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/run-timed.mjs dependencies -- npm ci
      - name: Check formatting and lint
        run: node scripts/ci/run-timed.mjs biome -- npm run check
      - name: Check TypeScript
        run: node scripts/ci/run-timed.mjs typescript -- npx tsc -b

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/run-timed.mjs dependencies -- npm ci
      - name: Test application logic
        run: node scripts/ci/run-timed.mjs unit -- npm test
      - name: Test automation helpers and contracts
        run: node scripts/ci/run-timed.mjs automation-contracts -- npm run test:ci

  generated-code:
    name: Generated code drift
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/run-timed.mjs dependencies -- npm ci
      - name: Install pinned Rust toolchain
        run: node scripts/ci/run-timed.mjs rust-toolchain -- rustup show
      - name: Check generated bindings
        run: |
          node scripts/ci/run-timed.mjs bindings -- npm run bindings
          git diff --exit-code -- src/generated
      - name: Check generated stage catalog
        run: |
          node scripts/ci/run-timed.mjs stage-catalog -- npm run stages:sync
          git diff --exit-code -- src-tauri/data/stages.json src-tauri/data/operators.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

  rust-tests:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/run-timed.mjs dependencies -- npm ci
      - name: Install pinned Rust toolchain
        run: node scripts/ci/run-timed.mjs rust-toolchain -- rustup show
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-tests-windows-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-tests-windows-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
      - name: Build frontend for Rust context
        run: node scripts/ci/run-timed.mjs frontend-build -- npm run build
      - name: Check Rust formatting
        run: node scripts/ci/run-timed.mjs rustfmt -- cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Check Rust lint
        run: node scripts/ci/run-timed.mjs clippy -- cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust
        run: node scripts/ci/run-timed.mjs rust-tests -- cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

  ui-smoke-tests:
    name: UI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: node scripts/ci/run-timed.mjs dependencies -- npm ci
      - name: Check smoke fixtures
        run: node scripts/ci/run-timed.mjs smoke-types -- npm run check:smoke
      - name: Install smoke browser
        run: node scripts/ci/run-timed.mjs browser-install -- npx playwright install --with-deps --only-shell chromium
      - name: Test basic UI functionality
        run: node scripts/ci/run-timed.mjs ui-smoke -- npm run test:smoke
      - name: Upload smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/smoke-results
            .local/smoke-report
            .local/ci-timings.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Smoke Test
    needs:
      - static-checks
      - unit-tests
      - generated-code
      - rust-tests
      - ui-smoke-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every smoke job to pass
        env:
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          GENERATED_CODE: ${{ needs.generated-code.result }}
          RUST_TESTS: ${{ needs.rust-tests.result }}
          UI_SMOKE_TESTS: ${{ needs.ui-smoke-tests.result }}
        run: |
          test "$STATIC_CHECKS" = success
          test "$UNIT_TESTS" = success
          test "$GENERATED_CODE" = success
          test "$RUST_TESTS" = success
          test "$UI_SMOKE_TESTS" = success
